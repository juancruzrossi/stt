version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Incompatible with faster-whisper 1.2.1; see constraint in pyproject.toml.
      - dependency-name: av
        versions: [">=19"]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
