name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --frozen --no-sync pytest
      - run: uv run --frozen --no-sync mypy src
      - run: uvx --from ruff==0.15.22 ruff check src tests
      - name: Audit runtime dependencies
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes > "$RUNNER_TEMP/runtime.txt"
          uvx --from pip-audit==2.10.1 pip-audit \
            --no-deps --disable-pip -r "$RUNNER_TEMP/runtime.txt"
