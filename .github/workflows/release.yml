name: Build macOS release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked --no-dev --group build
      - run: uv run --frozen --no-sync python -m stt.install_model .models/faster-whisper-base
      - run: ./build_app.sh
      - run: codesign --verify --deep --strict dist/STT.app
      - run: file dist/STT.app/Contents/MacOS/STT | grep '${{ matrix.arch }}'
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/STT-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/STT.app "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
