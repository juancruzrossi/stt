[project]
name = "stt"
version = "0.2.0"
description = "Simple, fast, local speech-to-text dictation for macOS with Faster Whisper."
requires-python = ">=3.12,<3.13"
dependencies = [
  "click>=8.1",
  "faster-whisper>=1.2.1,<2",
  "huggingface-hub>=1.24.0",
  "numpy>=1.26",
  "pyobjc-framework-applicationservices>=12.1; sys_platform == 'darwin'",
  "sounddevice>=0.5.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin'"]

[dependency-groups]
build = [
    "py2app>=0.28.10,<0.29",
]
dev = [
  "mypy>=2.3.0",
  "pytest>=9.1.1",
]

[project.scripts]
stt = "stt.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["AppKit", "Foundation", "faster_whisper", "objc", "sounddevice"]
ignore_missing_imports = true
