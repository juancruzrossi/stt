[project]
name = "stt"
version = "0.3.0"
description = "Simple, fast, local speech-to-text dictation for macOS and Linux with Faster Whisper."
requires-python = ">=3.12,<3.13"
dependencies = [
  "click>=8.1",
  "faster-whisper>=1.2.1,<2",
  "huggingface-hub>=2.4.0",
  "numpy>=1.26",
  "pyobjc-framework-applicationservices>=12.1; sys_platform == 'darwin'",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "sounddevice>=0.5.0; sys_platform == 'darwin'",
]

[tool.uv]
# faster-whisper 1.2.1 passes `metadata_errors` to av.open(), removed in av 19.
constraint-dependencies = ["av<19"]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "mypy>=2.3.0",
  "pytest>=9.1.1",
]

[project.scripts]
stt = "stt.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "sounddevice", "Xlib", "Xlib.*"]
ignore_missing_imports = true
