[project]
name = "stt"
version = "0.1.1"
description = "Simple, fast local python speech-to-text dictation with Faster Whisper."
requires-python = ">=3.10,<3.13"
dependencies = [
  "click>=8.1",
  "faster-whisper>=1.2.1,<2",
  "huggingface-hub>=0.26",
  "numpy>=1.26",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyperclip>=1.9.0",
  "pynput>=1.7.7",
  "sounddevice>=0.5.0",
  "soundfile>=0.12.1",
]

[dependency-groups]
dev = [
  "mypy>=1.20.2",
  "pytest>=8.0",
  "types-pynput>=1.8.1.20260408",
  "types-pyperclip>=1.11.0.20260408",
]

[project.scripts]
stt = "stt.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "sounddevice"]
ignore_missing_imports = true
